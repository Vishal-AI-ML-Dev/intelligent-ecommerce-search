name: ecommerce-search

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-ecommerce_search}
  POSTGRES_USER: ${POSTGRES_USER:-ecommerce_search}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-3}

services:
  # LOCAL DEVELOPMENT ONLY: POSTGRES_USER is a superuser here so the migration can
  # CREATE EXTENSION vector. This is not the intended production security model.
  db:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_search}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce_search}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build: .
    image: ecommerce-search:m1
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: ecommerce-search:m1
    environment:
      <<: *app-env
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-10}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
      SEARCH_LEXICAL_K: ${SEARCH_LEXICAL_K:-50}
      SEARCH_DEFAULT_TOP_K: ${SEARCH_DEFAULT_TOP_K:-10}
      SEARCH_MAX_QUERY_LENGTH: ${SEARCH_MAX_QUERY_LENGTH:-200}
      # Milestone 4 dense search: the pinned model is read from the read-only mount below.
      # Since M26A the image also carries the two pinned snapshots; this mount and
      # EMBEDDING_MODELS_DIR override them, so Compose keeps reading the host models/. Without a
      # fetched snapshot, /search/dense returns a fixed 503 while /search and /health keep working.
      SEARCH_DENSE_K: ${SEARCH_DENSE_K:-50}
      # Milestone 5 hybrid search (lexical + dense + RRF).
      SEARCH_CANDIDATE_K: ${SEARCH_CANDIDATE_K:-50}
      SEARCH_RRF_K: ${SEARCH_RRF_K:-100}
      # Milestone 8 reranked search (V3). The cross-encoder is a provisional pin (ADR-007), read
      # from the same read-only mount below and never downloaded at runtime; without a fetched
      # snapshot, an enabled /search/reranked returns a fixed 503 whenever it has candidates to
      # rerank, and the other routes keep working.
      # SEARCH_RERANK_DEPTH must not exceed SEARCH_CANDIDATE_K.
      RERANKER_ENABLED: ${RERANKER_ENABLED:-true}
      RERANKER_MODEL_ID: ${RERANKER_MODEL_ID:-cross-encoder/ms-marco-MiniLM-L6-v2}
      RERANKER_MODEL_REVISION: ${RERANKER_MODEL_REVISION:-233902d25c440f23af6f7d6e94d2946bac0bee0a}
      RERANKER_BATCH_SIZE: ${RERANKER_BATCH_SIZE:-16}
      SEARCH_RERANK_DEPTH: ${SEARCH_RERANK_DEPTH:-20}
      # Milestone 18 retailer returns (api only). Empty means unset: with no token every /returns
      # route answers 503, and commit also needs the flag, the importer credentials and the label.
      RETURNS_VIEWER_TOKEN: ${RETURNS_VIEWER_TOKEN:-}
      RETURNS_IMPORTER_TOKEN: ${RETURNS_IMPORTER_TOKEN:-}
      RETURNS_IMPORT_COMMIT_ENABLED: ${RETURNS_IMPORT_COMMIT_ENABLED:-false}
      RETURNS_IMPORTER_LABEL: ${RETURNS_IMPORTER_LABEL:-}
      RETURNS_IMPORTER_DB_USER: ${RETURNS_IMPORTER_DB_USER:-}
      RETURNS_IMPORTER_DB_PASSWORD: ${RETURNS_IMPORTER_DB_PASSWORD:-}
      EMBEDDING_MODELS_DIR: /models
    volumes:
      - ./models:/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
