# Milestone 23A baseline CI (docs/m23a-progress.md): the existing core search and the M25A page.
# Routine CI never calls Jev or any other remote model and never downloads model snapshots;
# `real_model` tests and the live Playwright project run only locally (see the progress doc).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.12"
  NODE_VERSION: "24.22.1"

jobs:
  backend:
    name: backend lint + hermetic unit suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      # This job *is* the hermetic child of tests/unit/test_unit_isolation.py: the same variable
      # prefixes are removed, POSTGRES_PASSWORD is empty, and the same pytest command runs. The
      # child flag makes the recursive test skip (reported by -ra) instead of running the whole
      # suite a second time; its assurance comes from this step passing.
      - name: hermetic unit suite (equivalent of the isolation test's child)
        run: |
          for name in $(compgen -e); do
            case "$name" in
              POSTGRES_*|DB_*|APP_ENV*|LOG_LEVEL*|EMBEDDING_*|SEARCH_*|RERANKER_*) unset "$name" ;;
            esac
          done
          export ECOMMERCE_SEARCH_HERMETIC_CHILD=1 POSTGRES_PASSWORD=""
          uv run --frozen python -m pytest -m "not integration and not real_model" -q -p no:cacheprovider -ra

  integration:
    name: database integration suite (pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        # Same image as docker-compose.yml. A throwaway container: the password below is a
        # per-run placeholder for it, not a credential for any real database.
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: ecommerce_search
          POSTGRES_USER: ecommerce_search
          POSTGRES_PASSWORD: ci-ephemeral-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce_search -d ecommerce_search"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ecommerce_search
      POSTGRES_USER: ecommerce_search
      POSTGRES_PASSWORD: ci-ephemeral-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      # Scratch databases only (tests/integration/conftest.py). real_model tests need the fetched
      # model snapshots and stay local.
      - run: uv run --frozen python -m pytest tests/integration -m "integration and not real_model" -q -p no:cacheprovider -ra

  frontend:
    name: frontend typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e-fixture:
    name: fixture Playwright against the FastAPI-served build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No database service and no model snapshots exist in this job; every /search/** request is
    # answered in the browser from synthetic fixtures (frontend/playwright.config.ts). Settings
    # still require a non-empty password, so a placeholder is given; nothing connects with it.
    env:
      POSTGRES_PASSWORD: ci-placeholder-no-database
      JEV_ENABLED: "false"
      SEARCH_V4_JEV_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e:fixture
        working-directory: frontend
      # Playwright output only (trace and screenshots are off in the config): synthetic fixture
      # data, no environment, no .env, no models, no caches.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-fixture-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
